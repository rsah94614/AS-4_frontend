apiVersion: apps/v1
kind: Deployment
metadata:
  name: aabhar-frontend
  namespace: default
  labels:
    app: aabhar-frontend
    component: frontend
    project: aabhar
spec:
  replicas: 1  # High Availability: If one pod crashes, the other stays live
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aabhar-frontend
  template:
    metadata:
      labels:
        app: aabhar-frontend
    spec:
      # Standard Security: Ensuring the pod runs as a non-root user
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
      containers:
      - name: frontend
        image: mrmonster786/employee-rr-frontend:latest
        imagePullPolicy: Always # Critical since Jenkins pushes to the 'latest' tag
        ports:
        - containerPort: 3000
        
        # Resource management ensures the pod doesn't starve the cluster
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "300m"
            memory: "512Mi"

        # Injecting secrets for any Server-Side (Next.js) operations
        envFrom:
        - secretRef:
            name: rnr-secrets

        # Health checks: The ALB uses these to know when to send traffic
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: aabhar-frontend
  namespace: default
spec:
  type: ClusterIP # Internal only; the ALB will bridge the external gap
  selector:
    app: aabhar-frontend
  ports:
    - protocol: TCP
      port: 80        # The port used by the ALB Ingress
      targetPort: 3000 # The port where the Next.js server lives